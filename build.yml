name: Build Windows mod
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Install Ninja
        run: choco install ninja --yes
      - name: Configure
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --parallel
      - name: Upload .dusk
        uses: actions/upload-artifact@v4
        with:
          name: twilight-bokoblin-mod-windows-x64
          path: build/mods/*.dusk
          if-no-files-found: error
